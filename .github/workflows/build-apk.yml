name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FRB_VERSION: "2.0.0"
  FLUTTER_CHANNEL: "stable"
  NDK_VERSION: "r26d"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Cache cargo bin tools
        id: cargo-bin-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-frb-${{ env.FRB_VERSION }}-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.cargo-bin-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Install flutter_rust_bridge_codegen
        if: steps.cargo-bin-cache.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version ${{ env.FRB_VERSION }} --locked

      - name: Scaffold Flutter Android project
        working-directory: flutter_app
        run: flutter create . --platforms=android --project-name expense_db_app --org com.expensedb

      - name: Set Android launcher label to Slip
        working-directory: flutter_app
        run: |
          sed -i 's|android:label="expense_db_app"|android:label="Slip"|g' \
            android/app/src/main/AndroidManifest.xml
          echo "--- AndroidManifest.xml after patch ---"
          grep 'android:label' android/app/src/main/AndroidManifest.xml || true

      - name: Install Slip launcher icon
        working-directory: flutter_app
        run: |
          # Generate launcher icons from the Slip icon asset for each density.
          ICON=assets/branding/slip_icon.png
          if [ ! -f "$ICON" ]; then
            echo "Slip icon asset not found at $ICON" >&2
            exit 1
          fi
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq imagemagick
          declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for d in "${!SIZES[@]}"; do
            mkdir -p "android/app/src/main/res/mipmap-$d"
            convert "$ICON" -resize "${SIZES[$d]}x${SIZES[$d]}" \
              "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          echo "--- Generated launcher icons ---"
          ls -la android/app/src/main/res/mipmap-*/ic_launcher.png

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate FRB bridge code
        working-directory: flutter_app
        run: |
          mkdir -p lib/src/bridge
          flutter_rust_bridge_codegen generate

      - name: Cross-compile Rust for Android (arm64 + armv7)
        working-directory: crates/ffi
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../../flutter_app/android/app/src/main/jniLibs \
            build --release

      - name: Build APK (release, split per ABI)
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: expense-db-apks
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
