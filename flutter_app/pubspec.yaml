name: expense_db_app
description: Expense logger powered by a custom LSM-tree database engine.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Rust FFI bridge (run `flutter_rust_bridge_codegen generate` after setup)
  flutter_rust_bridge: 2.0.0

  # State management
  flutter_riverpod: ^2.4.0

  # Charts
  fl_chart: ^0.65.0

  # Date picker
  intl: ^0.18.0

  # Icons
  cupertino_icons: ^1.0.6

  # App-documents directory for the database path
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
